<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalcSolver - Locked</title>
    <style>
        :root {
            --bg-start: #0f172a;
            --bg-end: #1e293b;
            --card: #111827;
            --text: #e5e7eb;
            --muted: #9ca3af;
            --accent: #22c55e;
            --accent-hover: #16a34a;
            --border: #374151;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: min(480px, 100%);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 1.8rem;
        }

        p {
            margin: 0 0 20px;
            color: var(--muted);
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0b1220;
            color: var(--text);
            margin-bottom: 14px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 700;
            background: var(--accent);
            color: #052e16;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: var(--accent-hover);
        }

        .error {
            margin-bottom: 14px;
            color: #fca5a5;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>CalcSolver</h1>
        <p>This site is password protected. Enter the password to continue.</p>
        <div id="error" class="error" style="display:none;">Incorrect password. Please try again.</div>
        <form action="/unlock" method="post">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Unlock Site</button>
        </form>
    </main>

    <script>
        const hasError = new URLSearchParams(window.location.search).get('error')
        if (hasError === '1') {
            document.getElementById('error').style.display = 'block'
        }
    </script>
</body>
</html>
