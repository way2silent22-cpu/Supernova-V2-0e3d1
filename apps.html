<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Troid - Apps</title>
    <link rel="stylesheet" href="games.css">
    <style>
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .app-card {
            background: var(--card-bg);
            aspect-ratio: 4 / 5;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
            text-align: center;
            text-decoration: none;
            color: white;
        }
        .app-card:hover {
            transform: translateY(-5px);
            background-color: var(--accent-color);
        }
        .app-card img {
            width: 100%;
            height: 70%;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .fullscreen-iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1000;
            background: black;
        }
        .close-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
    <script>
        function openFullscreen(url) {
            const iframe = document.createElement('iframe');
            iframe.src = url;
            iframe.className = 'fullscreen-iframe';
            iframe.setAttribute('allowfullscreen', '');
            document.body.appendChild(iframe);

            const closeBtn = document.createElement('button');
            closeBtn.innerText = 'Close';
            closeBtn.className = 'close-btn';
            closeBtn.onclick = () => {
                iframe.remove();
                closeBtn.remove();
            };
            document.body.appendChild(closeBtn);
        }
    </script>
</head>
<body>
    <header>
        <h1>Project Troid</h1>
        <nav>
            <button onclick="location.href='index.html'">Games</button>
            <button onclick="location.href='apps.html'">Apps</button>
        </nav>
    </header>

    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-section">
                <a href="index.html" class="item">🔶 Home</a>
                <a href="#" class="item">🤩 Popular</a>
                <a href="#" class="item">⚠️ Recent</a>
                <a href="#" class="item">👖 Favorites</a>
            </div>
            <div class="categories">
                <a href="#" class="category">💬 Social</a>
                <a href="#" class="category">📺 Video</a>
                <a href="#" class="category">🛠️ Tools</a>
                <a href="#" class="category">📁 Storage</a>
                <a href="#" class="category">🤖 AI</a>
            </div>
        </aside>

        <main class="content">
            <section class="game-header">
                <h2>Full-Screen Apps</h2>
            </section>
            
            <div class="app-grid">
                <div class="app-card" onclick="openFullscreen('https://web.whatsapp.com/')">
                    <img src="https://via.placeholder.com/200x160?text=WhatsApp+Web" alt="WhatsApp Web">
                    <h3>WhatsApp Web</h3>
                </div>
                <div class="app-card" onclick="openFullscreen('https://discord.com/app')">
                    <img src="https://via.placeholder.com/200x160?text=Discord" alt="Discord">
                    <h3>Discord</h3>
                </div>
                <div class="app-card" onclick="openFullscreen('https://www.youtube.com/')">
                    <img src="https://via.placeholder.com/200x160?text=YouTube" alt="YouTube">
                    <h3>YouTube</h3>
                </div>
                <div class="app-card" onclick="openFullscreen('https://www.openai.com/chatgpt')">
                    <img src="https://via.placeholder.com/200x160?text=ChatGPT" alt="ChatGPT">
                    <h3>ChatGPT</h3>
                </div>
                <div class="app-card" onclick="openFullscreen('https://www.google.com/drive/')">
                    <img src="https://via.placeholder.com/200x160?text=Google+Drive" alt="Google Drive">
                    <h3>Google Drive</h3>
                </div>
            </div>
        </main>
    </div>

    <footer>
        <p>&copy; 2024 Project Troid</p>
    </footer>
</body>
</html>
